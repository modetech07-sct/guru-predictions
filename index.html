<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Гуру прогнозов</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
  h1 { color: #333; margin-bottom: 10px; }
  #points { font-size: 28px; margin: 10px; }
  .match-list { margin-top: 20px; text-align: left; display: inline-block; }
  .match-item { margin: 10px 0; }
  .match-item input { width: 50px; font-size: 18px; text-align: center; margin: 0 5px; }
  button { padding: 5px 10px; font-size: 14px; background: #2196F3; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<h1>🎯 Гуру прогнозов</h1>
<div id="points">Очки: 0 XP</div>

<div class="match-list" id="match-list">
  <h2>Прогнозы на неделю:</h2>
</div>

<button onclick="submitAllPredictions()">Отправить все прогнозы</button>

<script>
const Telegram = window.Telegram?.WebApp || null;
let points = 0;

// Массив матчей 16-го тура РПЛ 2025 года
const matches = [
  {date: "2025-11-21T18:00:00", home: "Акрон", away: "Сочи"},
  {date: "2025-11-22T14:00:00", home: "Оренбург", away: "Балтика"},
  {date: "2025-11-22T16:00:00", home: "Спартак", away: "ЦСКА"},
  {date: "2025-11-22T18:00:00", home: "Рубин", away: "Ахмат"},
  {date: "2025-11-23T12:00:00", home: "Крылья Советов", away: "Ростов"},
  {date: "2025-11-23T14:00:00", home: "Пари НН", away: "Зенит"},
  {date: "2025-11-23T16:00:00", home: "Динамо (Москва)", away: "Динамо (Махачкала)"},
  {date: "2025-11-23T18:00:00", home: "Локомотив", away: "Краснодар"}
];

const matchListEl = document.getElementById("match-list");

// Создаём элементы для матчей
matches.forEach(match => {
  const div = document.createElement("div");
  div.className = "match-item";
  div.dataset.match = `${match.home} vs ${match.away}`;
  div.dataset.datetime = match.date;
  div.innerHTML = `<strong>${new Date(match.date).toLocaleString('ru-RU')} — ${match.home} vs ${match.away}</strong> 
    <input type="number" placeholder="0" class="home-goals"> :
    <input type="number" placeholder="0" class="away-goals">`;
  matchListEl.appendChild(div);
});

// Обновление очков на экране
function updateUI() {
  document.getElementById("points").innerText = `Очки: ${points} XP`;
}

// Проверка времени: принимаем прогноз только за 2 часа до первого матча
function isBeforeDeadline() {
  const firstMatchDate = new Date(matches[0].date);
  const deadline = new Date(firstMatchDate.getTime() - 2 * 60 * 60 * 1000); // -2 часа
  const now = new Date();
  return now < deadline;
}

// Отправка прогнозов
function submitAllPredictions() {
  if(!isBeforeDeadline()) {
    alert("Прогнозы можно отправлять только до 2 часов до начала первого матча!");
    return;
  }

  const preds = [];
  document.querySelectorAll(".match-item").forEach(item => {
    const home = item.querySelector(".home-goals").value;
    const away = item.querySelector(".away-goals").value;
    if(home !== "" && away !== "") {
      preds.push({match: item.dataset.match, pred: `${home}:${away}`});
    }
  });

  if(preds.length === 0) {
    alert("Введите хотя бы один прогноз");
    return;
  }

  if(Telegram) {
    Telegram.sendData(JSON.stringify(preds));
  } else {
    alert("Telegram WebApp не найден");
  }

  points += preds.length * 100;
  updateUI();
}

updateUI();
</script>

</body>
</html>
