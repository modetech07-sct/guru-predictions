<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Гуру прогнозов</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
  h1 { color: #333; margin-bottom: 10px; }
  #points { font-size: 28px; margin: 10px; }
  .match-list { margin-top: 20px; text-align: left; display: inline-block; }
  .match-item { margin: 10px 0; }
  .match-item input { width: 50px; font-size: 18px; text-align: center; margin: 0 5px; }
  button { padding: 5px 10px; font-size: 14px; background: #2196F3; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<h1>🎯 Гуру прогнозов</h1>
<div id="points">Очки: 0 XP</div>

<div class="match-list" id="match-list">
  <h2>Прогнозы на неделю:</h2>
</div>

<button id="submitBtn">Отправить все прогнозы</button>

<script>
let points = 0;
const matchListEl = document.getElementById("match-list");
const submitBtn = document.getElementById("submitBtn");

// Проверяем наличие Telegram WebApp
const Telegram = window.Telegram || { WebApp: { sendData: (d)=>alert("WebApp.sendData: "+d) } };

// Загружаем матчи
fetch('matches.json')
  .then(res => res.json())
  .then(matches => {
    const now = new Date();
    const firstMatchDate = new Date(matches[0].date);
    const cutoffDate = new Date(firstMatchDate.getTime() - 2*60*60*1000); // минус 2 часа

    matches.forEach(match => {
      const matchDate = new Date(match.date);
      const div = document.createElement("div");
      div.className = "match-item";
      div.dataset.match = `${match.home} vs ${match.away}`;
      div.dataset.datetime = match.date;
      div.innerHTML = `<strong>${matchDate.toLocaleString()} — ${match.home} vs ${match.away}</strong>
        <input type="number" placeholder="0" class="home-goals"> :
        <input type="number" placeholder="0" class="away-goals">`;
      matchListEl.appendChild(div);
    });

    // Блокировка отправки, если время прошло
    if(now > cutoffDate){
      submitBtn.disabled = true;
      submitBtn.innerText = "Ставки закрыты";
      alert("Прогнозы закрыты: прошло более 2 часов до первого матча");
    }
  })
  .catch(err => console.error("Ошибка загрузки матчей:", err));

function updateUI() {
  document.getElementById("points").innerText = `Очки: ${points} XP`;
}

function submitAllPredictions() {
  const preds = [];
  document.querySelectorAll(".match-item").forEach((item) => {
    const home = item.querySelector(".home-goals").value;
    const away = item.querySelector(".away-goals").value;
    if(home !== "" && away !== "") {
      preds.push({match: item.dataset.match, pred: `${home}:${away}`});
    }
  });

  if(preds.length === 0){
    alert("Введите хотя бы один прогноз");
    return;
  }

  // Отправляем данные в Telegram
  Telegram.WebApp.sendData(JSON.stringify(preds));

  // Начисляем очки
  points += preds.length * 100;
  updateUI();
}

updateUI();
submitBtn.addEventListener("click", submitAllPredictions);
</script>

</body>
</html>
